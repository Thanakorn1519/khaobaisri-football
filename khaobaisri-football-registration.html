<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบลงทะเบียนทีมนักกีฬาฟุตบอล</title></head><body><div id="app">กำลังโหลดระบบลงทะเบียน...</div><script>(async()=>{try{const p='assets/registration/';const m=await (await fetch(p+'manifest.json')).json();let s='';for(const f of m.files)s+=await (await fetch(p+f)).text();const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const out=new Response(new Blob([b]).stream().pipeThrough(ds));document.open();document.write(await out.text());document.close()}catch(e){document.getElementById('app').textContent='ไม่สามารถโหลดระบบลงทะเบียนได้: '+e}})()</script></body></html>
